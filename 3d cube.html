<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}

.con{
    width:200px;
    height:200px;
    perspective:600px;
}

.cube{
    width:200px;
    height:200px;
    position:relative;
    transform-style:preserve-3d;
    animation:rotate 6s infinite linear;
}

.fornt{

    width:200px;
    height:200px;
    border:3px solid rgb(0, 0, 0);
    position: absolute; 
    background-color: rgba(255, 192, 203, 0.523);
     transform: rotateY(0deg) translateZ(100px); 
}
.back{
    
    width:200px;
    height:200px;
    border:3px solid black;
    position: absolute;
    background-color: rgba(0, 255, 255, 0.54);
    transform: rotateY(180deg) translateZ(100px);
}
.right{
    
    width:200px;
    height:200px;
    border:3px solid black;
    position: absolute;
    background-color: rgba(255, 0, 255, 0.616);
    transform: rotateY(90deg) translateZ(100px);
}
.left{
    
    width:200px;
    height:200px;
    border:3px solid black;
    position: absolute;
    background-color: rgba(22, 194, 99, 0.577);
    transform: rotateY(-90deg) translateZ(100px);
}
.top{
    
    width:200px;
    height:200px;
    border:3px solid black;
    position: absolute;
    background-color: rgba(127, 255, 212, 0.578);
    transform: rotateX(90deg) translateZ(100px);
}
.bottom{
    position:absolute;
    width:200px;
    height:200px;
    border:3px solid black;
    background-color: rgba(255, 0, 0, 0.605);
    transform: rotateX(-90deg) translateZ(100px);
}



@keyframes rotate{
    0%{ transform: rotateX(0deg) rotateY(0deg); }
    100%{ transform: rotateX(360deg) rotateY(360deg); }
}

</style>
</head>

<body>

<div class="con">
    <div class="cube">
        <div class="front"></div>
        <div class="back"></div>
        <div class="right"></div>
        <div class="left"></div>
        <div class="top"></div>
        <div class="bottom"></div>
    </div>
</div>

</body>
</html>

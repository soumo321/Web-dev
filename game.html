<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 100vh;
            width: 100vw;
            background-color: aqua;
            border: 3px solid black;
            display: flex;
        }
        .bar{
            height: 2%;
            width: 4%;
            background-color: aliceblue;
            border: 1px solid black;
            animation-name: bar;
            animation-duration: 10s;
            position: relative;
            top: 600px;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-duration: alternate;
            /* animation-timing-function: ease-in-out; */
            


        }
        .ball{
            height: 20px;
            width: 20px;
            background-color: red;
            animation-name: ball;
            animation-duration: 10s;
            position: relative;
            border-radius: 100px;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-duration: alternate;
            animation-timing-function: ease-in-out;
        }
        @keyframes ball{
            0%{
                position: relative;
                top:0;
                left: 0;
            }
            10%{
                position: relative;
                top:600px;
                left: 100px;

            }
            30%{
                position: relative;
                top: 0%;
                left: 200px;

            }
            40%{
                position: relative;
                top:600px;
                left:300px;
            }
            50%{
                position: relative;
                top:0;
                left:400px;
            }
            70%{
                position: relative;
                top:600px;
                left:600px;
            }
            80%{
                position: relative;
                top:0px;
                left: 800px;
            }
            100%{
                position: relative;
                top: 600px;
                left:1000px;
            }
        }
        @keyframes bar{
            0%{
                position: relative;
                
                left: 0%;
                
            }
            10%{
                position: relative;
                left:150px ;
            }
            30%{
                position: relative;
                left: 250px;
            }
            40%{
                position: relative;
                left:350px;
            }
            50%{
                position: relative;
                left: 450px;
            }
            70%{
                position: relative;
                left: 650px;
            }
            80%{
                position: relative;
                left:850px ;
            }
            100%{
                position: relative;
                left: 1050px;
            
        }
    }
    </style>
</head>
<body>
    <div class="parent">
        <div class="bar"></div>
        <div class="ball"></div>

    </div>
</body>
</html>
